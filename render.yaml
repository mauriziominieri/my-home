services:
  - type: web
    name: my-home-backend
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - server.ts
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
        - index.html
        - firebase-applet-config.json
        - src/**
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev --legacy-peer-deps && npm install --include=dev --legacy-peer-deps react-is && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GCP_MONITORING_SERVICE_ACCOUNT
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false



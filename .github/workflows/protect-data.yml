name: Proteggi e migra data/*.json su branch data

on:
  push:
    branches: ['main']
    paths:
      - 'data/consumi.json'
      - 'data/bollette.json'
      - '.github/workflows/protect-data.yml'

permissions:
  contents: write

jobs:
  sync-to-data-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository con storico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migra/ripristina data/*.json sul branch dedicato data
        run: |
          git fetch origin --prune
          mkdir -p /tmp/seed-data

          for f in data/consumi.json data/bollette.json data/octopus_tariff.json; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/seed-data/$(basename "$f")"
            else
              last_commit=$(git log origin/main --diff-filter=AM -n 1 --format=%H -- "$f")
              if [ -n "$last_commit" ]; then
                echo "Recupero $f da origin/main ($last_commit)"
                git show "$last_commit:$f" > "/tmp/seed-data/$(basename "$f")"
              fi
            fi
          done

          git reset --hard HEAD
          rm -rf data

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            rm -rf data
          fi

          mkdir -p data
          changed=0
          for name in consumi.json bollette.json octopus_tariff.json; do
            if [ ! -f "data/$name" ] && [ -f "/tmp/seed-data/$name" ]; then
              cp "/tmp/seed-data/$name" "data/$name"
              changed=1
            fi
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "Migra/protegge data/*.json su branch dedicato data"
              git push origin HEAD:data
            fi
          fi

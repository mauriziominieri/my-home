name: Deploy su GitHub Pages (mauriziominieri.github.io/my-home)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install --legacy-peer-deps react-is

      - name: Build per GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Copia dati JSON sincronizzati se presenti
        run: |
          mkdir -p dist/data
          for f in data/consumi.json data/bollette.json data/octopus_tariff.json; do
            if [ -f "$f" ]; then
              cp "$f" dist/data/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

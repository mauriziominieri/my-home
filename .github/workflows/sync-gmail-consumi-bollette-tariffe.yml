name: Sync automatico Gmail (consumi kWh, bollette Luce/Acqua/TARI e tariffe)

on:
  schedule:
    - cron: '*/30 * * * *' # Ogni 30 minuti per consumi kWh e nuove bollette in INBOX
    - cron: '0 7,19 * * *' # Controllo tariffe luce 2 volte al giorno (07:00 e 19:00 UTC)
  workflow_dispatch:

concurrency:
  group: 'gmail-sync-and-tariff'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze PDF e Firebase Admin SDK
        run: pip install --quiet pypdf firebase-admin

      - name: Sincronizza Gmail INBOX su Firestore (consumi kWh + bollette + Storage dedicato + Email/WhatsApp)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          POD_CODE: "IT001E11251419"
        run: python scripts/sync_gmail_consumi_e_bollette.py

      - name: Controlla tariffe luce (Octopus + principali fornitori)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7,19 * * *'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: python scripts/check_octopus_tariff.py

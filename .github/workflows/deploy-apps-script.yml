name: Deploy Google Apps Script

on:
  push:
    branches: ['main']
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  group: 'apps-script-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica presenza script (.gs / .js)
        id: check_files
        run: |
          gs_count=$(find apps-script -maxdepth 2 -type f \( -name '*.gs' -o -name '*.js' \) | wc -l | tr -d ' ')
          echo "gs_count=$gs_count" >> "$GITHUB_OUTPUT"
          if [ "$gs_count" -eq 0 ]; then
            echo "::warning::Nessun file .gs o .js presente in apps-script/. Esegui prima 'cd apps-script && npx @google/clasp pull' in locale per importare gli script live senza sovrascriverli."
          fi

      - name: Verifica secret CLASPRC_JSON
        id: check_secret
        if: steps.check_files.outputs.gs_count != '0'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::warning::Secret GitHub CLASPRC_JSON non configurato. Esegui 'npx @google/clasp login' in locale e salva ~/.clasprc.json nel secret CLASPRC_JSON per abilitare il deploy automatico su Apps Script."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check_files.outputs.gs_count != '0' && steps.check_secret.outputs.has_secret == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrivi credenziali clasp e pubblica su Google Apps Script
        if: steps.check_files.outputs.gs_count != '0' && steps.check_secret.outputs.has_secret == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const outPath = path.join(process.env.HOME, ".clasprc.json");
            const raw = (process.env.CLASPRC_JSON || "").replace(/^\uFEFF/, "").trim();
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (e) {
              console.error("::error::Il secret CLASPRC_JSON non contiene un JSON valido.");
              process.exit(1);
            }
            if (parsed && parsed.tokens && !parsed.tokens.default) {
              const keys = Object.keys(parsed.tokens).filter((k) => parsed.tokens[k]);
              if (keys.length > 0) {
                parsed.tokens.default = parsed.tokens[keys[0]];
              }
            }
            const hasV3 = Boolean(parsed?.tokens?.default?.access_token || parsed?.tokens?.default?.refresh_token);
            const hasV1Local = Boolean(parsed?.token?.access_token || parsed?.token?.refresh_token);
            const hasV1Global = Boolean(parsed?.access_token || parsed?.refresh_token);
            if (!hasV3 && !hasV1Local && !hasV1Global) {
              console.error("::error::CLASPRC_JSON non contiene token OAuth validi di clasp. Riesegui \"npx @google/clasp login\" in locale e copia ~/.clasprc.json.");
              process.exit(1);
            }
            fs.writeFileSync(outPath, JSON.stringify(parsed, null, 2), { mode: 0o600 });
          '
          chmod 600 "$HOME/.clasprc.json"
          cd apps-script
          npx --yes @google/clasp@3.4.1 push --force

      - name: Pulizia credenziali
        if: always()
        run: rm -f "$HOME/.clasprc.json"

name: Sync automatico e-distribuzione (da Gmail)

on:
  schedule:
    - cron: '*/30 * * * *' # Ogni 30 minuti
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze PDF
        run: pip install --quiet pypdf

      - name: Estrai CSV e-distribuzione e Bollette Edison da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POD_CODE: "IT001E11251419"
        run: python scripts/sync_edistribuzione.py

      - name: Controlla tariffa Octopus Energy (avviso email se < 0,1595 €/kWh)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/check_octopus_tariff.py

      - name: Salva dati aggiornati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/consumi.json data/bollette.json data/octopus_tariff.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico consumi, bollette e controllo tariffa Octopus"
          git push

name: Sync automatico e-distribuzione e bollette (da Gmail a Firestore)

on:
  schedule:
    - cron: '*/10 * * * *' # Ogni 10 minuti, 24/7 anche a browser chiuso (tempi reali 10-30 min per coda GitHub)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze PDF e Firebase Admin SDK
        run: pip install --quiet pypdf firebase-admin

      - name: Sincronizza Gmail INBOX direttamente su Firebase Firestore (consumi, bollette e PDF)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          POD_CODE: "IT001E11251419"
        run: python scripts/sync_edistribuzione.py

      - name: Controlla tariffe luce (Octopus + principali fornitori)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/check_octopus_tariff.py

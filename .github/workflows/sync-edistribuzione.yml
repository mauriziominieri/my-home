name: Sync automatico e-distribuzione (da Gmail)

on:
  schedule:
    - cron: '0 */6 * * *' # Ogni 6 ore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Estrai CSV e-distribuzione da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POD_CODE: "IT001E11251419"
        run: python scripts/sync_edistribuzione.py

      - name: Salva data/consumi.json nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/consumi.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico consumi da Gmail e-distribuzione"
          git push

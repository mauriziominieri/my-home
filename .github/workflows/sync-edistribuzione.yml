name: Sync automatico e-distribuzione (da Gmail)

on:
  schedule:
    - cron: '*/10 * * * *' # Ogni 10 minuti, 24/7 anche a browser chiuso (frequenza sicura per Gmail IMAP)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze PDF
        run: pip install --quiet pypdf

      - name: Estrai CSV e-distribuzione, Bollette Edison e TARI Acegas da Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          POD_CODE: "IT001E11251419"
        run: python scripts/sync_edistribuzione.py

      - name: Controlla tariffe luce (Octopus + principali fornitori)
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/check_octopus_tariff.py

      - name: Salva aggiornamenti nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/consumi.json data/bollette.json data/octopus_tariff.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento automatico Gmail e tariffe mercato"
            git pull --rebase --autostash origin main || true
            git push
          fi

